<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GameBattle12 — Web Arcade</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background: #0b0f19; color: #f8fafc; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 32px 16px; }
    header { text-align: center; max-width: 720px; margin-bottom: 28px; }
    h1 { font-size: 2.2rem; color: #38bdf8; margin-bottom: 8px; }
    p { color: #94a3b8; line-height: 1.5; }
    .card { background: #131a2a; border: 1px solid #1e293b; border-radius: 16px; padding: 24px; width: 100%; max-width: 720px; box-shadow: 0 12px 30px rgba(0,0,0,0.35); }
    .hud { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; font-weight: 600; }
    canvas { width: 100%; height: 360px; background: #070b14; border-radius: 12px; display: block; border: 1px solid #263349; }
    .controls { display: flex; gap: 12px; justify-content: center; margin-top: 18px; flex-wrap: wrap; }
    button { background: #38bdf8; color: #06101a; border: none; padding: 10px 20px; border-radius: 10px; font-weight: 700; cursor: pointer; }
    button:hover { background: #7dd3fc; }
    .hint { text-align: center; color: #64748b; font-size: 0.9rem; margin-top: 12px; }
  </style>
</head>
<body>
  <header>
    <h1>GameBattle12</h1>
    <p>Live web project hosted on Vercel from GitHub. Click Start and use Left/Right arrow keys or on-screen buttons to catch stars!</p>
  </header>

  <div class="card">
    <div class="hud">
      <div>Score: <span id="score">0</span></div>
      <div>Best: <span id="best">0</span></div>
    </div>
    <canvas id="gameCanvas" width="680" height="360"></canvas>
    <div class="controls">
      <button id="leftBtn">← Left</button>
      <button id="startBtn">Start / Restart</button>
      <button id="rightBtn">Right →</button>
    </div>
    <div class="hint">ArrowLeft / ArrowRight or buttons to move</div>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const bestEl = document.getElementById('best');
    const startBtn = document.getElementById('startBtn');
    const leftBtn = document.getElementById('leftBtn');
    const rightBtn = document.getElementById('rightBtn');

    let bestScore = Number(localStorage.getItem('gamebattle12_best') || 0);
    bestEl.textContent = bestScore;

    let score = 0;
    let running = false;
    let player = { x: canvas.width / 2 - 35, y: canvas.height - 28, w: 70, h: 14, speed: 7 };
    let star = { x: Math.random() * (canvas.width - 24) + 12, y: 15, r: 10, speed: 3.2 };
    let keys = { left: false, right: false };

    function resetGame() {
      score = 0;
      scoreEl.textContent = score;
      star.y = 15;
      star.x = Math.random() * (canvas.width - 30) + 15;
      star.speed = 3.2;
      running = true;
    }

    function update() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      if (running) {
        if (keys.left) player.x -= player.speed;
        if (keys.right) player.x += player.speed;
        player.x = Math.max(0, Math.min(canvas.width - player.w, player.x));

        star.y += star.speed;

        if (
          star.y + star.r >= player.y &&
          star.x >= player.x &&
          star.x <= player.x + player.w
        ) {
          score += 10;
          scoreEl.textContent = score;
          if (score > bestScore) {
            bestScore = score;
            bestEl.textContent = bestScore;
            localStorage.setItem('gamebattle12_best', bestScore);
          }
          star.y = 15;
          star.x = Math.random() * (canvas.width - 30) + 15;
          star.speed = Math.min(8.5, star.speed + 0.25);
        } else if (star.y - star.r > canvas.height) {
          running = false;
        }
      }

      ctx.fillStyle = '#38bdf8';
      ctx.fillRect(player.x, player.y, player.w, player.h);

      ctx.fillStyle = '#facc15';
      ctx.beginPath();
      ctx.arc(star.x, star.y, star.r, 0, Math.PI * 2);
      ctx.fill();

      if (!running) {
        ctx.fillStyle = '#f8fafc';
        ctx.font = 'bold 22px system-ui, sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('Press "Start / Restart" to Play', canvas.width / 2, canvas.height / 2);
      }

      requestAnimationFrame(update);
    }

    startBtn.addEventListener('click', resetGame);
    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowLeft') keys.left = true;
      if (e.key === 'ArrowRight') keys.right = true;
    });
    window.addEventListener('keyup', (e) => {
      if (e.key === 'ArrowLeft') keys.left = false;
      if (e.key === 'ArrowRight') keys.right = false;
    });
    leftBtn.addEventListener('mousedown', () => keys.left = true);
    leftBtn.addEventListener('mouseup', () => keys.left = false);
    rightBtn.addEventListener('mousedown', () => keys.right = true);
    rightBtn.addEventListener('mouseup', () => keys.right = false);

    update();
  </script>
</body>
</html>
